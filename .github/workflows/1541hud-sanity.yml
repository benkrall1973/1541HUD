name: 1541HUD Sanity

on:
  workflow_dispatch:
  push:
    paths:
      - '1541hud/**'
      - 'OneROM/plugins/user/1541hud-probe/**'
      - 'OneROM/plugins/system/usb/**'
      - 'OneROM/firmware/src/piodma/pio.c'
      - 'OneROM/ci/build.sh'
      - 'README.md'
      - '.github/workflows/1541hud-sanity.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - '1541hud/**'
      - 'OneROM/plugins/user/1541hud-probe/**'
      - 'OneROM/plugins/system/usb/**'
      - 'OneROM/firmware/src/piodma/pio.c'
      - 'OneROM/ci/build.sh'
      - 'README.md'
      - '.github/workflows/1541hud-sanity.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  source-sanity:
    name: 1541HUD source sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical 1541HUD sources
        shell: bash
        run: |
          set -euo pipefail

          test -f 1541hud/Build-1541HUD-V0032.ps1
          test -f 1541hud/Build-1541HUD-Current.ps1
          test -f 1541hud/gui/1541HUD_V0.0.32.py
          test -f 1541hud/CHANGELOG.md
          test -f README.md
          test -f docs/RELEASE-V0.0.32.md
          test -f OneROM/plugins/user/1541hud-probe/src/1541hud_mailbox.h
          test -f OneROM/plugins/system/usb/include/1541hud_mailbox.h

          cmp OneROM/plugins/user/1541hud-probe/src/1541hud_mailbox.h \
              OneROM/plugins/system/usb/include/1541hud_mailbox.h

          grep -q 'HUD1541_PASSIVE_UB4' OneROM/firmware/src/piodma/pio.c
          grep -q 'HUD1541_PASSIVE_UB4' OneROM/ci/build.sh
          grep -q 'Stable release:.*V0.0.32' README.md
          grep -q '## v0.0.32' 1541hud/CHANGELOG.md

          python3 -m py_compile 1541hud/gui/1541HUD_V0.0.32.py

          if grep -Rni --include='README.md' --include='*.py' --include='*.ps1' 'V0.0.31 candidate' 1541hud README.md; then
            echo 'Stale V0.0.31 candidate wording found.' >&2
            exit 1
          fi

          if git ls-files | grep -Ei '(^|/)(build-1541hud|build-drivehud|__pycache__)(/|$)|(\.bin$|\.uf2$|\.elf$|\.o$|\.pyc$)|pre_drivehud'; then
            echo 'Tracked generated artifact or obsolete backup found.' >&2
            exit 1
          fi

          echo '1541HUD source sanity checks passed.'
