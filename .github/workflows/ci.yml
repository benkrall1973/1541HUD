name: CI Build

permissions:
  contents: write
  actions: read

defaults:
  run:
    working-directory: OneROM

on:
  workflow_dispatch:
  push:
    paths:
      - 'OneROM/**'
      - '.github/**'
      - '!.github/workflows/release.yml'
      - '!**.md'
      - '!docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'OneROM/**'
      - '.github/**'
      - '!.github/workflows/release.yml'
      - '!**.md'
      - '!docs/**'

# The work is split across jobs rather than run as one sequence. Each job gets
# its own runner and its own timeout. The upstream OneROM source tree lives
# under OneROM/ in this repository, so shell commands run from that directory.

jobs:
  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils python3 \
                                libudev-dev libusb-1.0-0-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - name: Cache Emscripten SDK
      uses: actions/cache@v4
      with:
        path: ~/emsdk
        key: emsdk-${{ runner.os }}-${{ hashFiles('OneROM/ci/install-emscripten.sh', 'OneROM/ci/emscripten-version') }}

    - name: Install Emscripten (for One ROM Lens)
      run: |
        ci/install-emscripten.sh "$HOME/emsdk"
        source "$HOME/emsdk/emsdk_env.sh"
        emcc --version | head -1
        echo "PATH=$PATH" >> "$GITHUB_ENV"
        echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"

    - name: Install wasm target
      run: rustup target add wasm32-unknown-emscripten

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust

    - name: Run Rust lint (rustfmt + clippy)
      run: ci/rust-lint.sh

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust

    - name: Run various Rust tests
      run: ci/rust-tests.sh

  rust-docs:
    name: Rust docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust

    - name: Build Rust docs
      run: ci/rust-docs.sh

  emulator-tests:
    name: Emulator tests (${{ matrix.socket }} pin)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        socket: [24, 28, 32, 40]
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust
        shared-key: emulator-tests

    - name: Run One ROM emulator tests
      run: ci/test-emu.sh ${{ matrix.socket }}

  firmware:
    name: Firmware and plugins
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust

    - name: Build firmware
      run: ci/build.sh ci

    - name: Build plugins
      run: |
        make clean
        make
        make -C plugins/system/usb
        make -C plugins/user/activity
        make -C plugins/user/blink
        make -C plugins/user/host-control
        make -C plugins/user/rgb
        make -C firmware/ora/examples

  tools:
    name: Tools (One ROM Lab)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust

    - name: Build tools
      run: ci/rust-tools.sh

  binaries:
    name: Binaries (CLI and Studio)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils \
                                libudev-dev libusb-1.0-0-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust

    - name: Build CLI and Studio
      run: ci/rust-binaries.sh

  lens:
    name: One ROM Lens (wasm)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libcurl4-openssl-dev libjson-c-dev \
                                libzip-dev make xz-utils python3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Arm GNU toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('OneROM/ci/arm-toolchain-version') }}

    - name: Install Arm GNU toolchain
      run: echo "TOOLCHAIN=$(ci/install-arm-toolchain.sh)" >> "$GITHUB_ENV"

    - name: Cache Emscripten SDK
      uses: actions/cache@v4
      with:
        path: ~/emsdk
        key: emsdk-${{ runner.os }}-${{ hashFiles('OneROM/ci/install-emscripten.sh', 'OneROM/ci/emscripten-version') }}

    - name: Install Emscripten (for One ROM Lens)
      run: |
        ci/install-emscripten.sh "$HOME/emsdk"
        source "$HOME/emsdk/emsdk_env.sh"
        emcc --version | head -1
        echo "PATH=$PATH" >> "$GITHUB_ENV"
        echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"

    - name: Install wasm target
      run: rustup target add wasm32-unknown-emscripten

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: OneROM/rust

    - name: Build One ROM Lens (wasm)
      run: ci/build-lens.sh
